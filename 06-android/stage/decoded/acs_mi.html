<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #000;
            color: #f0f0f0;
            cursor: pointer;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }



        .container {
            padding: 20px;
            position: relative;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .section-title-1 {
            color: #ffb6c1;
            margin: 30px 0 10px;

            font-size: 14px;
        }

        .section-title {
            color: #ffb6c1;
            margin-top: 99px;
            font-size: 14px;
        }

        .item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .item svg {
            width: 30px;
            height: 30px;
            margin-right: 15px;
            border-radius: 50%;
            padding: 5px;
        }

        .item-content {
            display: flex;
            flex-direction: column;
        }

        .item-content .title {
            font-size: 18px;
        }

        .item-content .subtitle {
            font-size: 14px;
            color: #bbb;
        }


        .highlight {
            border: 2px solid #00aaff;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 60px;

            animation: shrinkGrow 2s infinite;
        }

        .tooltip {
            position: absolute;
            top: 100%;
            left: 10px;
            margin-top: 10px;
            background: rgba(0, 170, 255, 0.964);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            color: #000000;
            max-width: 300px;
            width: max-content;
            min-width: 320px;
            box-sizing: border-box;
            text-align: center;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            z-index: 111;
        }

        .tooltip::after {
            content: '';
            position: absolute;
            top: -17px;
            left: 20px;
            border-width: 8px;
            border-style: solid;
            border-color: transparent transparent rgba(0, 170, 255, 0.85) transparent;
        }


        .fab {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: #2196F3;
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 9px 40px;
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            cursor: pointer;
           
        }

        @keyframes shrinkGrow {

            0%,
            100% {

                background-color: #6060607b;
            }

            50% {

                background-color: #afafaf00;
            }
        }
    </style>
</head>

<body>
    <div class="container">

            <div class="item-content">
                <div class="title" id="accessibilitymenu">Accessibility Menu</div>
                <div class="subtitle" id="accessibilitymenusub">Off / Control device via large menu</div>
            </div>
        </div>
    </div>

    <button class="fab" id="enablebtn">Enable</button>
