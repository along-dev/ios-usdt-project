# =============================================================================
# nginx.local.conf —— 本机/裸机部署配置（R2-4 裁决 ① 的落地件）
# =============================================================================
# ★ 来源：Owner 裁决 ①（2026-10-02）—— 前置 nginx，8888/3000/8080 只在内网。
#
# ★ 与 `default.conf.template` 的分工：
#   · `default.conf.template` —— **Docker Compose** 用（含 `envsubst` 变量）
#   · 本文件               —— **本机 / 裸机** 用（**已填好 127.0.0.1，无变量**）
#
# ★★ 配套（缺一不可）：
#   ① 服务只绑 loopback（否则 nginx 前置形同虚设）：
#        set BIND_HOST=127.0.0.1      # Go:8888 / Node:3000 / 代理:8080 三方通用
#      ★ 已实现（T26/收尾），实测反向断言通过（LAN 访问被拒）
#   ② 8080 代理应当【关闭】或【不对公网】（它是**测试设施**，见 P-41）
#      ⇒ 正式部署用本 nginx 替代 8080 的静态服务 + 路由分流
#
# ★ 用法（Windows + nginx for Windows）：
#   nginx.exe -c <此文件的绝对路径>
#   ★ 注意 nginx 的 -c 需要【绝对路径】或相对 prefix 的路径
#
# ★ Linux：
#   cp nginx.local.conf /etc/nginx/conf.d/usdt.conf && nginx -t && nginx -s reload
#
# ★ 端口约定（可改）：
#   listen 8080  —— 对外入口（★ 与旧"8080 代理"同端口，便于前端零改动）
#   ★ 若 8080 被旧代理占用，先停旧代理（见下）
# =============================================================================

upstream usdt_app_server {
    # Node 3000（★ 已绑 loopback）
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream usdt_go_server {
    # Go 8888（★ 已绑 loopback）
    server 127.0.0.1:8888;
    keepalive 32;
}

server {
    # ★ 对外入口。生产可改 listen 80/443。
    # ★ T114（G-06）：8080 与测试期 Node 代理 `_gva_proxy.cjs` 同端口 —— 二者互斥、二选一（勿同起）。
    listen       8080;
    server_name  localhost;

    # 前端静态资源根（★ 指向构建产物 dist）
    root  E:/USDT项目/03-web-admin/dist;
    index index.html;

    # ---- 安全头（与模板一致）----
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # ---- 静态资源缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- 管理台侧静态（T21：19 预览图 + landing 资源）----
    #   ★ 走 Node 3000（那里有 /images/* 与 /landing-pages/* 的挂载）
    location /images/ {
        proxy_pass http://usdt_app_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /landing-pages/ {
        proxy_pass http://usdt_app_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # ★★★ 看板端点属【Node:3000】，不是 Go（T26 / A-B2）
    #   必须放在 `location /api/` 之前 ⇒ nginx 前缀匹配取【最长者】，自动优先。
    location /api/dashboard/ {
        proxy_pass http://usdt_app_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
    }

    # ---- 其余 /api/ 走 Go（★ 剥一层 /api，与 Go 的注册路径对齐）----
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://usdt_go_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    # ---- Go 侧根路径组 ----
    location /base/ {
        proxy_pass http://usdt_go_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    location /user/ {
        proxy_pass http://usdt_go_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    # ---- 管理台登录页 / 面板页（Node 侧）----
    location /mgr-admin-8bcde2021d98/ {
        proxy_pass http://usdt_app_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    # ---- SPA fallback（前端是 vue-router history 模式）----
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
