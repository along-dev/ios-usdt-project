name: gasleak

services:
  nginx:
    image: gasleak-nginx:${IMAGE_VERSION}
    ports:
      - ${NGINX_PORT:-80}:80
      - ${NGINX_SSL_PORT:-443}:443
    environment:
      - ADMIN_DOMAIN=${ADMIN_DOMAIN}
      # ★ T112（G-04）：落地页/主站投递域名（原 default.conf.template:115 硬编码 DOMAIN_PLACEHOLDER）。
      - LANDING_DOMAIN=${LANDING_DOMAIN}
      # ★ T115（G-05）：证书路径参数化（原 5 处硬编码 /etc/nginx/cert/ios17.cc.cert/.key）。
      - SSL_CERT=${SSL_CERT:-/etc/nginx/cert/ios17.cc.cert}
      - SSL_KEY=${SSL_KEY:-/etc/nginx/cert/ios17.cc.key}
      # ★ F1-C6：管理台（Go:8888）的上游主机。
      #   处置选择 (b2)：Go 后端【由 compose 外提供】（本 compose 不含其服务定义，
      #   因为 Go 侧有独立的构建与部署通道）。
      #   host.docker.internal 让容器内可访问宿主机上监听的 Go:8888；
      #   若 Go 与 nginx 同处一个 docker 网络，改设为该服务名即可。
      - ADMIN_BACKEND_HOST=${ADMIN_BACKEND_HOST:-host.docker.internal}
      # ★★★ T26 / R2-4 收尾（Owner 裁决 ①，2026-10-02）：
      #   Node 上游主机。原模板里硬编码为 `server`（= 本 compose 的服务名）
      #   ⇒ 非 Docker 环境无法复用该模板。
      #   ⇒ 现参数化为 APP_BACKEND_HOST，**默认值保持 `server`**
      #     （= 本 compose 的 Node 服务名）⇒ **Docker 行为完全不变**。
      #   ★ 改用别处部署时（如 nginx 跑在宿主机）：设 APP_BACKEND_HOST=127.0.0.1
      - APP_BACKEND_HOST=${APP_BACKEND_HOST:-server}
    extra_hosts:
      # Linux 下 host.docker.internal 需显式映射（Docker Desktop 会自动提供）
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/cert:/etc/nginx/cert:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./landing/shopg:/usr/share/nginx/html/shopg
      - ./landing/shopins:/usr/share/nginx/html/shopins
    depends_on:
      - server
    restart: unless-stopped

  server:
    image: gasleak-server:${IMAGE_VERSION}
    expose:
      - 3000
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./landing:/app/landing
    env_file: .env
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    volumes:
      - ./data/mongo:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  # ===== T125 新增（⛔ 未改上面 4 个 service 的任何一行）=====

  go-backend:
    build:
      context: ../..
      dockerfile: 08-infra/dockerfiles/go-backend.Dockerfile
    ports:
      - ${GO_PORT:-8888}:8888
    env_file: .env
    # ★ F-T125-2 返修：viper 默认 ConfigFile="config.yaml"（core/viper.go:27），
    #   无 GVA_CONFIG 时读 /app/config.yaml ⇒ 挂载目标名必须是 config.yaml
    #   （⛔ 原挂 config.docker.yaml 会导致服务启动 panic）。
    #   挂载<源>仍是 ./config.docker.yaml（部署方提供的 docker 版配置），⛔ 不碰本机 config.yaml。
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    depends_on:
      - mariadb
      - redis
    restart: unless-stopped

  mariadb:
    build:
      context: ../..
      dockerfile: 08-infra/dockerfiles/mariadb.Dockerfile
    ports:
      - ${MARIADB_PORT:-13306}:3306
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-qk_e2e}
    volumes:
      - ./data/mariadb:/var/lib/mysql
    restart: unless-stopped

