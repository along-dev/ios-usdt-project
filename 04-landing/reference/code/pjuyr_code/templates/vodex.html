body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#000;color:#fff;min-height:100vh;-webkit-font-smoothing:antialiased}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(0,0,0,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{width:36px;height:36px;border-radius:10px;object-fit:cover;display:block}
.header-brand{font-size:18px;font-weight:800;letter-spacing:-0.5px}
.header-right{display:flex;align-items:center;gap:12px}
.live-dot{width:6px;height:6px;background:#22c55e;border-radius:50%;animation:livePulse 2s infinite}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.5)}}
.online-badge{font-size:11px;color:rgba(255,255,255,0.6);font-weight:500;display:flex;align-items:center;gap:6px}
.online-num{color:#22c55e;font-weight:700}

/* Hero */
.hero{position:relative;padding:32px 20px 28px;text-align:center;overflow:hidden}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(transparent,#000);z-index:1}
.hero-content{position:relative;z-index:2}
.app-icon-wrap{margin-bottom:16px}
.app-icon{width:80px;height:80px;border-radius:18px;object-fit:cover;box-shadow:0 12px 40px rgba(0,0,0,0.5);border:2px solid rgba(255,255,255,0.1);display:block;margin:0 auto}
.hero h1{font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-bottom:4px;line-height:1.2}
.hero .subtitle{font-size:13px;color:rgba(255,255,255,0.65);margin-bottom:14px;font-weight:500}
.rating-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.rating-stars{display:flex;align-items:center;gap:2px}
.rating-stars .star{color:#fbbf24;font-size:14px}
.rating-score{font-size:22px;font-weight:800;letter-spacing:-0.5px}
.rating-count{font-size:11px;color:rgba(255,255,255,0.5);font-weight:500}
.rating-divider{width:1px;height:28px;background:rgba(255,255,255,0.12)}
.stat-item{text-align:center}
.stat-val{font-size:18px;font-weight:800}
.stat-label{font-size:10px;color:rgba(255,255,255,0.5);font-weight:500;text-transform:uppercase;letter-spacing:0.5px}
.tag-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.tag-pill{padding:5px 12px;border-radius:100px;font-size:11px;font-weight:600;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06)}
.tag-pill.accent{border:none}

/* Download Button */
.dl-btn{display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;text-decoration:none;padding:15px 32px;border-radius:14px;font-size:16px;font-weight:700;letter-spacing:-0.2px;transition:all 0.2s;width:100%;max-width:380px;margin:0 auto;position:relative;overflow:hidden}
.dl-btn::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,0.1) 50%,transparent 60%);animation:btnShine 3s infinite}
@keyframes btnShine{0%{transform:translateX(-100%) rotate(45deg)}100%{transform:translateX(100%) rotate(45deg)}}
.dl-btn:active{transform:scale(0.97)}
.dl-btn svg{width:20px;height:20px}
.dl-meta{margin-top:10px;font-size:11px;color:rgba(255,255,255,0.4);font-weight:500;text-align:center}

/* Section */
.section{padding:28px 16px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:18px;font-weight:800;letter-spacing:-0.3px}
.section-more{font-size:12px;font-weight:600;opacity:0.5}

/* Genre */
.genre-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.genre-scroll::-webkit-scrollbar{display:none}
.genre-chip{flex-shrink:0;padding:7px 16px;border-radius:100px;font-size:12px;font-weight:600;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:all 0.2s;white-space:nowrap}
.genre-chip.active{color:#fff;border-color:transparent}

/* Drama Grid */
.drama-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:480px){.drama-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){.drama-grid{grid-template-columns:repeat(4,1fr)}}
.drama-card{position:relative;border-radius:12px;overflow:hidden;background:#111;cursor:pointer;transition:transform 0.15s}
.drama-card:active{transform:scale(0.97)}
.drama-card .poster{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;transition:transform 0.3s}
.drama-card:hover .poster{transform:scale(1.03)}
.drama-card .card-info{padding:10px 10px 12px}
.drama-card .card-title{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.drama-card .card-meta{font-size:10px;color:rgba(255,255,255,0.45);font-weight:500}
.drama-card .card-badge{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:6px;font-size:9px;font-weight:800;letter-spacing:0.3px;text-transform:uppercase;color:#fff}
.drama-card .card-rating{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);padding:3px 7px;border-radius:6px;font-size:10px;font-weight:700;color:#fbbf24;display:flex;align-items:center;gap:3px}

/* Promo Banner */
.promo{margin:8px 16px;border-radius:16px;padding:28px 24px;text-align:center;position:relative;overflow:hidden}
.promo::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L60 30L30 60L0 30Z' fill='rgba(255,255,255,0.03)'/%3E%3C/svg%3E") repeat}
.promo h3{font-size:20px;font-weight:800;margin-bottom:6px;position:relative;letter-spacing:-0.3px}

.feature-title{font-size:14px;font-weight:700;margin-bottom:2px;letter-spacing:-0.2px}
.feature-desc{font-size:12px;color:rgba(255,255,255,0.45);line-height:1.4;font-weight:400}

.install{padding:28px 16px;background:rgba(255,255,255,0.02)}

.step{display:flex;gap:14px;align-items:center}

/* Footer */

.trust-item{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.4);font-weight:500}
.trust-icon{font-size:14px}

/* Urgency Banner */

.toast-text{color:rgba(255,255,255,0.8);line-height:1.4}
.toast-text strong{color:#fbbf24}
.toast-time{font-size:10px;color:rgba(255,255,255,0.3);margin-top:2px}

/* Floating Download Button */
.float-dl{position:fixed;bottom:16px;left:16px;right:16px;z-index:95;max-width:400px;margin:0 auto;opacity:0;transform:translateY(20px);transition:all 0.3s}
.float-dl.show{opacity:1;transform:translateY(0)}
.float-dl a{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:16px;font-size:15px;font-weight:800;color:#fff;text-decoration:none;box-shadow:0 8px 32px rgba(0,0,0,0.5)}

/* Mobile optimizations */
@media(max-width:480px){

  .stat-val{font-size:16px}
  .rating-score{font-size:20px}

  .bottom-cta{padding:24px 16px 100px}

/* Limited time banner */
.ltd-banner{background:linear-gradient(90deg,#f59e0b,#ef4444,#f59e0b);background-size:200% 100%;animation:ltdSlide 3s linear infinite;padding:8px 16px;text-align:center;font-size:12px;font-weight:700;color:#000;letter-spacing:0.5px}
@keyframes ltdSlide{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.ltd-banner span{background:rgba(0,0,0,0.15);padding:2px 8px;border-radius:4px;margin-left:4px;font-family:monospace}
</style>

  var steps = L.steps.map(function(s,i){

<!-- Visit Tracking -->
<script>
(function(){
  function genSid(){
    if(window.crypto&&crypto.randomUUID)return crypto.randomUUID().replace(/-/g,'');
    return Math.random().toString(36).slice(2)+Date.now().toString(36)+Math.random().toString(36).slice(2);
  }
  var sid=genSid(),dwell=0,visible=!document.hidden,lastTick=Date.now();
  function tick(){var now=Date.now();if(visible)dwell+=now-lastTick;lastTick=now;}
  document.addEventListener('visibilitychange',function(){tick();visible=!document.hidden;lastTick=Date.now();});
  function postJSON(url,body){try{return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),keepalive:true}).catch(function(){});}catch(e){}}
  postJSON('/api/track/start',{sid:sid,lang:navigator.language||'',url:location.href});
  setInterval(function(){tick();postJSON('/api/track/heartbeat',{sid:sid,dwell:dwell});},15000);
  function sendFinal(){tick();var p=JSON.stringify({sid:sid,dwell:dwell});if(navigator.sendBeacon){try{navigator.sendBeacon('/api/track/heartbeat',new Blob([p],{type:'application/json'}));}catch(e){postJSON('/api/track/heartbeat',{sid:sid,dwell:dwell});}}else{postJSON('/api/track/heartbeat',{sid:sid,dwell:dwell});}}
  window.addEventListener('pagehide',sendFinal);
  window.addEventListener('beforeunload',sendFinal);
  setTimeout(function(){
    document.querySelectorAll('.dl-link').forEach(function(a){
      a.addEventListener('click',function(){tick();postJSON('/api/track/click',{sid:sid,dwell:dwell});});
    });
  },1000);
})();
</script>
