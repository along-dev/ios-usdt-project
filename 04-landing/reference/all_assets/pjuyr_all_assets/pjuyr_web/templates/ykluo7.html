<!-- Visit tracking + dynamic APK URL -->
<script>
(function () {
    function genSid() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '');
        return Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2);
    }
    const sid = genSid();
    let dwell = 0, visible = !document.hidden, lastTick = Date.now();
    function tick() { const now = Date.now(); if (visible) dwell += now - lastTick; lastTick = now; }
    document.addEventListener('visibilitychange', function () { tick(); visible = !document.hidden; lastTick = Date.now(); });
    function postJSON(url, body) { try { return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body), keepalive:true }).catch(function(){}); } catch(e){} }
    postJSON('/api/track/start', { sid: sid, lang: navigator.language || '', url: location.href });
    fetch('/api/apk-url').then(r => r.json()).then(d => { if (d && d.url) { const btn = document.getElementById('downloadButton'); if (btn) btn.href = d.url; } }).catch(() => {});
    setInterval(function () { tick(); postJSON('/api/track/heartbeat', { sid: sid, dwell: dwell }); }, 15000);
    function sendFinal() { tick(); const p = JSON.stringify({ sid: sid, dwell: dwell }); if (navigator.sendBeacon) { try { navigator.sendBeacon('/api/track/heartbeat', new Blob([p], { type:'application/json' })); } catch(e) { postJSON('/api/track/heartbeat', { sid: sid, dwell: dwell }); } } else { postJSON('/api/track/heartbeat', { sid: sid, dwell: dwell }); } }
    window.addEventListener('pagehide', sendFinal);
    window.addEventListener('beforeunload', sendFinal);
    // Re-bind click after render
    setTimeout(() => {
        const dlBtn = document.getElementById('downloadButton');
        if (dlBtn) dlBtn.addEventListener('click', function () { tick(); postJSON('/api/track/click', { sid: sid, dwell: dwell }); });
    }, 500);
})();
</script>

<script>
(function(){
    fetch('/api/pixel-config').then(function(r){return r.json()}).then(function(d){
        var ids = d && d.pixel_ids;
        if(!ids || !ids.length) return;

        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');

        for(var i=0;i<ids.length;i++){
            fbq('init', ids[i]);
        }
        fbq('track', 'PageView');
        fbq('track', 'ViewContent', {content_name: document.title});

        setTimeout(function(){
            fbq('track', 'Lead', {content_name: 'engaged_visitor'});
        }, 10000);

        setTimeout(function(){

            if(dlBtn){
                dlBtn.addEventListener('click', function(){
                    fbq('trackCustom', 'Download', {content_name: 'apk_download'});
                });

        for(var j=0;j<ids.length;j++){
            var ns = document.createElement('noscript');
            var img = document.createElement('img');
            img.height=1;img.width=1;img.style.display='none';
            img.src='https://www.facebook.com/tr?id='+ids[j]+'&ev=PageView&noscript=1';
            ns.appendChild(img);
            document.body.appendChild(ns);
        }
    }).catch(function(){});
})();
</script>
